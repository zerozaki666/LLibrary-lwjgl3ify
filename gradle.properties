org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# RFG's Minecraft patch compile step needs a real Java 8 JDK with tools.jar.
# Disable broad auto-detection so Gradle does not accidentally pick a Java 8 JRE.
# Point one of these env vars at a JDK 8 install, for example:
# JAVA8_HOME=C:\Program Files\Eclipse Adoptium\jdk-8.0.xxx-hotspot
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=JAVA8_HOME,JDK8_HOME,JAVA_HOME
